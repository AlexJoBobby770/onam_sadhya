version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: onam_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: onam_sadhya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: onam_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/onam_sadhya_db
      - SECRET_KEY=onam_sadhya_super_secret_production_key_2026
      - DEV_MODE=false
    depends_on:
      - db

volumes:
  postgres_data:
